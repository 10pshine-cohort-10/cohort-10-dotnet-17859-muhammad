name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: restore
        run: dotnet restore backend/Docket.sln

      - name: build
        run: dotnet build backend/Docket.sln --configuration Release --no-restore

      - name: test (all)
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet test backend/Docket.Tests/Docket.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: test (unit only)
        if: matrix.os != 'ubuntu-latest'
        run: >
          dotnet test backend/Docket.Tests/Docket.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category!=Integration"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: verify formatting
        run: dotnet format backend/Docket.sln --verify-no-changes

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - name: design detector
        run: npm run detect

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: test with coverage
        run: >
          dotnet test backend/Docket.Tests/Docket.Tests.csproj
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7
